<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mol* Viewer</title>
    <script type="text/javascript" src="https://www.ebi.ac.uk/pdbe/pdb-component-library/js/pdbe-molstar-component-3.1.3.js"></script>
    <link rel="stylesheet" type="text/css" href="https://www.ebi.ac.uk/pdbe/pdb-component-library/css/pdbe-molstar-3.1.3.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
        #viewer { width: 100%; height: 100%; }
        .msp-plugin .msp-btn { color: #222 !important; border-color: #bbb !important; background-color: #fff !important; }
        .msp-plugin .msp-label-text { color: #222 !important; }
    </style>
</head>
<body>
    <div id="viewer"></div>

    <script type="text/javascript">
        const params = new URLSearchParams(window.location.search);
        const cifUrl = params.get('url');

        if (cifUrl) {
            const viewerInstance = new PDBeMolstarPlugin();
            const highlightsParam = params.get('highlights');
            let highlightData = [];
            
            try {
                if (highlightsParam && highlightsParam !== "null") {
                    highlightData = JSON.parse(highlightsParam);
                }
            } catch (e) { console.error("Failed to parse highlights", e); }

            // Budujemy paczki kolorystyczne
            const selections = (highlightData || []).map(h => ({
                auth_asym_id: h.chain || 'A',
                start_residue_number: parseInt(h.start),
                end_residue_number: parseInt(h.end),
                color: h.color || { r: 180, g: 180, b: 180 },
                focus: false
            })).filter(s => !isNaN(s.start_residue_number) && !isNaN(s.end_residue_number));

            const options = {
                customData: { url: cifUrl, format: 'cif' },
                hideControls: true,
                subscribeEvents: true,
                bgColor: { r: 255, g: 255, b: 255 },
                loadComplexity: 'high',
                hideStructure: ['low-resolution', 'water'],
                customTheme: {
                    active: true,
                    type: 'uniform',
                    value: { r: 180, g: 180, b: 180 }
                }
            };

            const viewerContainer = document.getElementById('viewer');
            viewerInstance.render(viewerContainer, options).then(() => {
                
                const applyColoring = () => {
                    // 1. Agresywne szarzenie wszystkiego (używamy wildcardów, aby złapać też "pomarańczowe" łańcuchy)
                    viewerInstance.visual.select({
                        data: [
                            { struct_asym_id: '*', color: { r: 180, g: 180, b: 180 } },
                            { auth_asym_id: '*', color: { r: 180, g: 180, b: 180 } }
                        ],
                        nonClick: true
                    });

                    // 2. Nakładanie highlightów
                    if (selections.length > 0) {
                        viewerInstance.visual.select({
                            data: selections,
                            nonClick: true
                        });
                        
                        // Druga próba dla identyfikatorów strukturalnych (czasem pliki CIF mają rozbieżność)
                        const structuralSelections = selections.map(s => ({...s, struct_asym_id: s.auth_asym_id}));
                        viewerInstance.visual.select({
                            data: structuralSelections,
                            nonClick: true
                        });
                    }
                };

                // Wykonujemy kolorowanie po 800ms i powtarzamy po 2s dla dużych struktur
                setTimeout(applyColoring, 800);
                setTimeout(applyColoring, 2500);
            });
        }
    </script>
</body>
</html>
